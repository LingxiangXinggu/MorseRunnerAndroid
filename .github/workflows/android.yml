name: Android ARM64
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test core and callsign data
        run: bash scripts/test-core.sh
      - uses: android-actions/setup-android@v3
      - name: Install Android toolchain
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;28.0.13004108" "cmake;3.22.1"
      - name: Build arm64-v8a debug APK
        run: bash scripts/build-android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: MorseRunner-arm64-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
